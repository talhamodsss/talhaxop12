<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Surprise for You! 💘</title>
    <style>
        body {
            background-color: #ffafbd;
            background-image: linear-gradient(45deg, #ffafbd 0%, #ffc3a0 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: 'Comic Sans MS', cursive;
            overflow: hidden;
        }
        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }
        h1 { color: #ff4d6d; font-size: 32px; }
        #messageText { font-size: 18px; color: #555; font-style: italic; }
        .btn-group { margin-top: 30px; position: relative; }
        button {
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            margin: 10px;
            transition: 0.3s;
        }
        #yesBtn { background: #ff4d6d; color: white; }
        #noBtn { background: #eee; color: #333; position: absolute; }
    </style>
</head>
<body>

<div class="card">
    <div id="gifContainer">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHIybHpxZzR4Nm5qZzR4Nm5qZzR4Nm5qZzR4Nm5qZzR4Nm5qJnB0PW0mZXA9djFfaW50ZXJuYWxfZ2lmX2J5X2lkJmN0PWc/KztT2c4u8mYYUiMKdJ/giphy.gif" width="150">
    </div>
    <h1 id="headline">Will you be my Valentine, <span id="recipientName">...</span>?</h1>
    <p id="messageText"></p>

    <div class="btn-group">
        <button id="yesBtn" onclick="celebrate()">YES! 😍</button>
        <button id="noBtn" onmouseover="moveNoButton()">No 😢</button>
    </div>
</div>

<script>
    // 1. Get data from URL
    const urlParams = new URLSearchParams(window.location.search);
    const encodedData = urlParams.get('v');

    if (encodedData) {
        try {
            const decoded = JSON.parse(atob(encodedData));
            document.getElementById('recipientName').innerText = decoded.n;
            document.getElementById('messageText').innerText = decoded.m || "I have a crush on you!";
        } catch(e) {
            console.error("Invalid link");
        }
    }

    // 2. The "No" button escape logic
    function moveNoButton() {
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 50);
        const btn = document.getElementById('noBtn');
        btn.style.left = x + 'px';
        btn.style.top = y + 'px';
    }

    // 3. Success logic
    function celebrate() {
        document.body.innerHTML = `
            <div class="card">
                <h1>Yay! See you on Feb 14th! 💖</h1>
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHIybHpxZzR4Nm5qZzR4Nm5qZzR4Nm5qZzR4Nm5qZzR4Nm5qJnB0PW0mZXA9djFfaW50ZXJuYWxfZ2lmX2J5X2lkJmN0PWc/26hpKMTca5QHOCuoM/giphy.gif" width="250">
            </div>
        `;
        // Optional: Trigger confetti here
    }
</script>

</body>
</html>
