<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine Proposal Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffeef2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h1 { color: #d63384; }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ffb6c1;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            background-color: #d63384;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        button:hover { background-color: #b82b6e; }
        #linkContainer {
            margin-top: 20px;
            display: none;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Make it Special 💖</h1>
    <p>Create a custom proposal link</p>
    
    <input type="text" id="recipientName" placeholder="Who is this for?">
    <textarea id="customMessage" placeholder="Custom Message (Optional)"></textarea>
    
    <button onclick="generateLink()">Generate Link 💌</button>

    <div id="linkContainer">
        <h3>Your Magical Link! ✨</h3>
        <p id="generatedLink"></p>
        <button onclick="copyLink()">Copy Link</button>
    </div>
</div>

<script>
    function generateLink() {
        const name = encodeURIComponent(document.getElementById('recipientName').value);
        const msg = encodeURIComponent(document.getElementById('customMessage').value);
        
        // In a real scenario, this would point to the "view" page
        const baseUrl = window.location.href.split('?')[0] + "view.html";
        const finalUrl = `${baseUrl}?name=${name}&msg=${msg}`;
        
        document.getElementById('generatedLink').innerText = finalUrl;
        document.getElementById('linkContainer').style.display = 'block';
    }

    function copyLink() {
        const link = document.getElementById('generatedLink').innerText;
        navigator.clipboard.writeText(link);
        alert("Link copied!");
    }
</script>

</body>
</html>
